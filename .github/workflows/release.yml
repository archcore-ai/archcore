name: Release

# Publish the plugin from the monorepo's dev branch. Public paths stay unchanged.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref (default: dev HEAD)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  test-before-release:
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ github.event.inputs.source_ref || github.ref }}

  release:
    needs: test-before-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Verify source is on dev lineage
        if: github.event_name == 'push'
        run: |
          git fetch origin dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::Tag commit is not reachable from origin/dev."
            exit 1
          fi

      - name: Export the public plugin tree
        run: ./scripts/export-plugin.sh "${RUNNER_TEMP}/archcore-plugin-release"

      - name: Commit the public tree
        run: |
          git config user.email "release-bot@archcore.ai"
          git config user.name "Archcore Release Bot"
          git checkout --orphan release-staging
          git rm -rf .
          cp -R "${RUNNER_TEMP}/archcore-plugin-release/." .
          git add -A
          git commit -m "release: ${GITHUB_REF_NAME:-manual-dispatch}" \
            -m "Exported from dev. See plugin/docs/release.md for the publication contract."

      - name: Force-push to main
        run: git push --force origin HEAD:main

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
