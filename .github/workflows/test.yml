name: Plugin Tests

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install bats-core
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
          else
            brew install bats-core
          fi

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq shellcheck
          else
            brew install shellcheck
          fi

      - name: Check JSON configs
        run: make check-json

      - name: Check script permissions
        run: make check-perms

      - name: ShellCheck
        run: make lint

      - name: Run tests
        run: make test

      - name: Resolve the pinned CLI asset
        id: cli-asset
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=archcore_linux_amd64.tar.gz; digest=e5939e81b84d18dd3f5557cea05481c7420033e3b592b31f6a53ecf7f6711ce4 ;;
            Darwin-arm64) asset=archcore_darwin_arm64.tar.gz; digest=bb01a9bee33f4eaf571d667ccef54f8e4e49bd9096d3e9193d8bf1481621364e ;;
            Darwin-x86_64) asset=archcore_darwin_amd64.tar.gz; digest=0b45a271f17fbf981e9994dc9aec1218f304f7ded1ce95d7c81d03bfa091d3ec ;;
            *) echo "Unsupported runner platform" >&2; exit 1 ;;
          esac
          {
            echo "asset=$asset"
            echo "digest=$digest"
            echo "dir=$RUNNER_TEMP/archcore-cli-0.10.1"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the pinned CLI from cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cli-asset.outputs.dir }}
          key: archcore-cli-0.10.1-${{ steps.cli-asset.outputs.digest }}

      - name: Install the pinned CLI for MCP integration tests
        if: steps.cli-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ASSET: ${{ steps.cli-asset.outputs.asset }}
          DIGEST: ${{ steps.cli-asset.outputs.digest }}
          CLI_DIR: ${{ steps.cli-asset.outputs.dir }}
        run: |
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 \
            "https://github.com/archcore-ai/archcore/releases/download/v0.10.1/$ASSET" -o "$ASSET"
          printf '%s  %s\n' "$DIGEST" "$ASSET" | shasum -a 256 --check
          tar -xzf "$ASSET" archcore
          rm -f "$ASSET"

      - name: Put the pinned CLI on PATH
        shell: bash
        run: echo "${{ steps.cli-asset.outputs.dir }}" >> "$GITHUB_PATH"

      - name: Real MCP integration tests
        run: make test-integration

      - name: Set up Go for the source CLI
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build the CLI from this commit
        working-directory: cli
        run: go build -ldflags '-X main.version=0.10.1-dev' -o "${RUNNER_TEMP}/archcore-source" .

      - name: MCP integration tests against the source CLI
        run: make test-integration ARCHCORE_BIN="${RUNNER_TEMP}/archcore-source"
