name: Plugin Tests

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install bats-core
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq bats
          else
            brew install bats-core
          fi

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq shellcheck
          else
            brew install shellcheck
          fi

      - name: Check JSON configs
        run: make check-json

      - name: Check script permissions
        run: make check-perms

      - name: ShellCheck
        run: make lint

      - name: Run tests
        run: make test

      - name: Resolve the pinned CLI asset
        id: cli-asset
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset=archcore_linux_amd64.tar.gz; digest=aedecc17741da45e58a86745b961edec7c6d63ab6d319cdb466428a48a471c7e ;;
            Darwin-arm64) asset=archcore_darwin_arm64.tar.gz; digest=dfbb11c65e5a78c798fd178ef612c3248549272a595102ec82197e02bc499fb1 ;;
            Darwin-x86_64) asset=archcore_darwin_amd64.tar.gz; digest=1beb644755ec19d7661b347836b0365246309c146d64ff7cd377056e3911ef8f ;;
            *) echo "Unsupported runner platform" >&2; exit 1 ;;
          esac
          {
            echo "asset=$asset"
            echo "digest=$digest"
            echo "dir=$RUNNER_TEMP/archcore-cli-0.8.6"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the pinned CLI from cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cli-asset.outputs.dir }}
          key: archcore-cli-0.8.6-${{ steps.cli-asset.outputs.digest }}

      - name: Install the pinned CLI for MCP integration tests
        if: steps.cli-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ASSET: ${{ steps.cli-asset.outputs.asset }}
          DIGEST: ${{ steps.cli-asset.outputs.digest }}
          CLI_DIR: ${{ steps.cli-asset.outputs.dir }}
        run: |
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 5 \
            "https://github.com/archcore-ai/cli/releases/download/v0.8.6/$ASSET" -o "$ASSET"
          printf '%s  %s\n' "$DIGEST" "$ASSET" | shasum -a 256 --check
          tar -xzf "$ASSET" archcore
          rm -f "$ASSET"

      - name: Put the pinned CLI on PATH
        shell: bash
        run: echo "${{ steps.cli-asset.outputs.dir }}" >> "$GITHUB_PATH"

      - name: Real MCP integration tests
        run: make test-integration
